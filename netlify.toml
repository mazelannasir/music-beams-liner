# Netlify Configuration for Music Beams Liner
[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Redirect all requests to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
