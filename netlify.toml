# Netlify Configuration for Music Beams Liner
[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Redirect all requests to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers configured to allow embedding in Google Sites, Google Classroom, and LMS iframes
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://*.google.com https://sites.google.com https://*.googleusercontent.com http://localhost:* https://*;"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
